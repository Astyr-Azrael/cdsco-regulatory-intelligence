services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdsco}
      POSTGRES_USER: ${POSTGRES_USER:-cdsco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdsco-local}
    ports:
      - "5432:5432"
    volumes:
      - cdsco_postgres:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://cdsco:cdsco-local@database:5432/cdsco
    ports:
      - "8000:8000"
    depends_on:
      - database

volumes:
  cdsco_postgres:
